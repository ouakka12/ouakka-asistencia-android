# CORE OUAKKA Asistencia — compilación Android ARM64 en la nube (GitHub Actions).
# Basado en el job oficial build-rustdesk-android de flutter-build.yml (RustDesk 1.5.1).
# Produce un APK firmado con clave de depuración temporal. La firma definitiva con la
# clave OUAKKA se hace en CORE 2 con apksigner: la keystore NUNCA se sube a GitHub.
name: OUAKKA Android APK

on:
  push:
    branches: [main, ouakka-main, play/compliance-consent]
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      rendezvous_server:
        description: "Servidor propio OUAKKA (ej. asistencia.ouakka.es). Vacío = servidor público de RustDesk"
        required: false
        default: ""
      rs_pub_key:
        description: "Clave pública del servidor (contenido de id_ed25519.pub). Es pública, no secreta"
        required: false
        default: ""
      play_bundle:
        description: "Generar AAB SIN firmar para pruebas controladas de Google Play"
        required: false
        type: boolean
        default: false

env:
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.2"
  NDK_VERSION: "r28c"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-android-arm64:
    needs: [generate-bridge]
    runs-on: ubuntu-24.04
    env:
      TARGET: aarch64-linux-android
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake curl gcc-multilib git g++ g++-multilib \
            libc6-dev libclang-dev libunwind-dev llvm-dev nasm ninja-build \
            openjdk-17-jdk-headless pkg-config wget

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Configurar servidor propio OUAKKA (si se indica)
        if: ${{ inputs.rendezvous_server != '' }}
        env:
          OUAKKA_SERVER: ${{ inputs.rendezvous_server }}
          OUAKKA_KEY: ${{ inputs.rs_pub_key }}
        run: |
          python3 - <<'PY'
          import os, re
          server = os.environ["OUAKKA_SERVER"].strip()
          key = os.environ["OUAKKA_KEY"].strip()
          assert re.fullmatch(r"[A-Za-z0-9.\-]+(:[0-9]+)?", server), "servidor no válido"
          assert re.fullmatch(r"[A-Za-z0-9+/=]{40,60}", key), "clave pública no válida"
          p = "libs/hbb_common/src/config.rs"
          s = open(p).read()
          s2 = re.sub(r'pub const RENDEZVOUS_SERVERS: &\[&str\] = &\[[^\]]*\];',
                      f'pub const RENDEZVOUS_SERVERS: &[&str] = &["{server}"];', s)
          s2 = re.sub(r'pub const RS_PUB_KEY: &str = "[^"]*";',
                      f'pub const RS_PUB_KEY: &str = "{key}";', s2)
          assert s2 != s, "no se pudo aplicar el servidor"
          open(p, "w").write(s2)
          print("Servidor OUAKKA configurado:", server)
          PY

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies (arm64-v8a)
        shell: bash
        run: |
          if ! ./flutter/build_android_deps.sh arm64-v8a; then
            find "${VCPKG_ROOT}/" -name "*.log" -exec sh -c 'echo "== $1"; cat "$1"' _ {} \;
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: ouakka-android
          key: ${{ env.TARGET }}

      - name: Build rustdesk native lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add $TARGET
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/ndk_arm64.sh

      - name: Build APK (simple client mode)
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/
          cp ./target/$TARGET/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          pushd flutter
          flutter build apk --release --target-platform android-arm64 --split-per-abi --build-name=1.5.2 --build-number=2070 --dart-define=OUAKKA_CLIENT_SIMPLE_MODE=true
          popd
          mkdir -p out
          cp flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/ouakka-asistencia-${{ env.VERSION }}-arm64-UNSIGNED-DEBUGKEY.apk
          sha256sum out/*.apk | tee out/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ouakka-asistencia-arm64
          path: out/
          retention-days: 14

      # Rama de cumplimiento: genera AAB de QA sin firmar. Nunca subir una APK debug a Play.
      # La AAB permanece SIN FIRMAR; la clave de subida se guarda en CORE, nunca en GitHub.
      - name: Build unsigned Play AAB (QA only)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.play_bundle == true) || github.ref_name == 'play/compliance-consent' }}
        shell: bash
        env:
          OUAKKA_SERVER: ${{ inputs.rendezvous_server }}
          OUAKKA_KEY: ${{ inputs.rs_pub_key }}
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          if [ -n "$OUAKKA_SERVER" ] && [ -z "$OUAKKA_KEY" ]; then
            echo 'Servidor propio especificado sin clave pública: no se compila.' >&2
            exit 1
          fi
          if [ -z "$OUAKKA_SERVER" ]; then
            echo 'AVISO QA: AAB de pruebas usa los servidores públicos de RustDesk. NO AUTORIZA distribución a clientes ni declaración de infraestructura privada.' >&2
          fi
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          # El build APK anterior usa debugkey temporal. La AAB NO debe quedar firmada con ella.
          sed -i 's/signingConfig signingConfigs.debug/signingConfig null/g' flutter/android/app/build.gradle
          grep -q 'signingConfig null' flutter/android/app/build.gradle
          pushd flutter
          flutter build appbundle --release --target-platform android-arm64 --build-name=1.5.2 --build-number=2070 --dart-define=OUAKKA_CLIENT_SIMPLE_MODE=true
          popd
          mkdir -p out-play
          cp flutter/build/app/outputs/bundle/release/app-release.aab "out-play/CORE-OUAKKA-Asistencia-${VERSION}-UNSIGNED.aab"
          python3 - <<'PY'
          import glob, zipfile
          files = glob.glob('out-play/*.aab')
          assert len(files) == 1, 'No hay una sola AAB'
          with zipfile.ZipFile(files[0]) as bundle:
              bad = [n for n in bundle.namelist() if n.startswith('META-INF/') and n.upper().endswith(('.RSA','.DSA','.EC','.SF'))]
          assert not bad, 'AAB inesperadamente firmada; NO subirla a Google Play: ' + ','.join(bad)
          print('AAB sin firma en CI; firmar con upload key local de CORE')
          PY
          sha256sum out-play/*.aab | tee out-play/SHA256.txt

      - name: Upload unsigned Play AAB for local signing
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.play_bundle == true) || github.ref_name == 'play/compliance-consent' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ouakka-play-aab-unsigned
          path: out-play/
          retention-days: 7
